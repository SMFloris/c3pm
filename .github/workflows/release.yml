name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-native:
    name: Build ${{ matrix.platform }} release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            linux: true
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            linux: true
          - os: macos-15
            platform: macos-aarch64
            linux: false
    env:
      C3_VERSION: "0.8.4"
      NIXPKGS_REF: github:NixOS/nixpkgs/a32edd7654519351e48e80372a928df336394670

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install C3 compiler on Linux x86_64
        if: matrix.platform == 'linux-x86_64'
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/c3lang/c3c/releases/download/v${C3_VERSION}/c3-linux-static.tar.gz" \
            --output "${RUNNER_TEMP}/c3-linux-static.tar.gz"
          tar -xzf "${RUNNER_TEMP}/c3-linux-static.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/c3" >> "${GITHUB_PATH}"

      - name: Install system Nix
        uses: cachix/install-nix-action@v31

      - name: Install pinned C3 compiler
        if: matrix.platform != 'linux-x86_64'
        run: |
          c3c_path="$(sh scripts/ci-install-c3c.sh '${{ matrix.platform }}')"
          echo "${c3c_path}/bin" >> "${GITHUB_PATH}"
          echo "C3PM_CI_C3C_PATH=${c3c_path}" >> "${GITHUB_ENV}"

      - name: Install musl toolchain
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build and run native executable
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          test "${GITHUB_REF_NAME}" = "v${release_version}"
          grep -Fx "const String C3PM_VERSION = \"${release_version}\";" src/version.c3
          grep -F "\"version\": \"${release_version}\"" project.json
          c3c --version | grep -F "${C3_VERSION}"
          c3c test
          if [ "${{ matrix.linux }}" = true ]; then
            c3c --linux-libc=musl -z -static --cc musl-gcc -O2 build c3pm
          else
            c3c -O2 build c3pm
          fi
          mkdir -p release
          cp build/c3pm "release/c3pm-${{ matrix.platform }}"
          chmod +x "release/c3pm-${{ matrix.platform }}"
          test -f "release/c3pm-${{ matrix.platform }}"
          test ! -L "release/c3pm-${{ matrix.platform }}"
          test -x "release/c3pm-${{ matrix.platform }}"
          test "$("release/c3pm-${{ matrix.platform }}" --version)" = "c3pm ${release_version}"
          if [ "${{ matrix.linux }}" = true ] &&
            readelf -l "release/c3pm-${{ matrix.platform }}" | grep -q INTERP; then
            echo "Linux release executable is dynamically linked" >&2
            exit 1
          fi

      - name: Test native release executable in a C3 project
        run: |
          export XDG_CONFIG_HOME="${RUNNER_TEMP}/c3pm-release-config"
          export XDG_DATA_HOME="${RUNNER_TEMP}/c3pm-release-data"
          release_c3pm="${GITHUB_WORKSPACE}/release/c3pm-${{ matrix.platform }}"
          "${release_c3pm}" toolchain nix use system
          cd examples/sqlite-example
          "${release_c3pm}" install
          if [ "${{ matrix.platform }}" != linux-x86_64 ]; then
            c3c_system="$(nix eval --raw --impure --expr builtins.currentSystem)"
            project_c3c="$(nix eval --raw "path:${PWD}/.c3pm/nix#c3pmToolchains.${c3c_system}.c3c.outPath")"
            test "${project_c3c}" = "${C3PM_CI_C3C_PATH}"
          fi
          "${release_c3pm}" shell -- c3c build
          "${release_c3pm}" shell -- ./build/sqlite_example add "native release smoke"
          "${release_c3pm}" shell -- ./build/sqlite_example list | grep -F "native release smoke"

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: c3pm-${{ matrix.platform }}
          path: release/c3pm-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build-native
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download native executables
        uses: actions/download-artifact@v4
        with:
          pattern: c3pm-*
          path: release
          merge-multiple: true

      - name: Create source archive and checksums
        run: |
          for platform in linux-x86_64 linux-aarch64 macos-aarch64; do
            test -f "release/c3pm-${platform}"
            chmod +x "release/c3pm-${platform}"
          done
          git archive \
            --format=zip \
            --prefix="c3pm-${GITHUB_REF_NAME}/" \
            --output="release/c3pm-${GITHUB_REF_NAME}-source.zip" \
            HEAD
          cp install.sh release/install.sh
          chmod +x release/install.sh
          cd release
          sha256sum \
            c3pm-linux-x86_64 \
            c3pm-linux-aarch64 \
            c3pm-macos-aarch64 \
            install.sh \
            "c3pm-${GITHUB_REF_NAME}-source.zip" \
            > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/c3pm-linux-x86_64 \
            release/c3pm-linux-aarch64 \
            release/c3pm-macos-aarch64 \
            release/install.sh \
            "release/c3pm-${GITHUB_REF_NAME}-source.zip" \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "c3pm ${GITHUB_REF_NAME}"
