name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-linux-x86_64:
    name: Build Linux x86_64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      C3_VERSION: "0.8.4"

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install C3 compiler
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/c3lang/c3c/releases/download/v${C3_VERSION}/c3-linux-static.tar.gz" \
            --output "${RUNNER_TEMP}/c3-linux-static.tar.gz"
          tar -xzf "${RUNNER_TEMP}/c3-linux-static.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/c3" >> "${GITHUB_PATH}"

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build standalone c3pm
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          case "${release_version}" in
            ""|*[!0-9A-Za-z.+-]*)
              echo "invalid release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac
          case "${C3_VERSION}" in
            ""|*[!0-9A-Za-z.+-]*)
              echo "invalid C3 version: ${C3_VERSION}" >&2
              exit 1
              ;;
          esac
          readme_c3_version="$(sed -n \
            's/^> \*\*Default C3 target:\*\* C3 \(.*\)\.$/\1/p' README.md)"
          case "${readme_c3_version}" in
            ""|*[!0-9A-Za-z.+-]*)
              echo "invalid C3 version in README.md: ${readme_c3_version}" >&2
              exit 1
              ;;
          esac
          readme_c3_pattern="${readme_c3_version//./\\.}"
          sed -i \
            "s/^const String C3PM_VERSION = .*$/const String C3PM_VERSION = \"${release_version}\";/" \
            src/version.c3
          sed -i "s/${readme_c3_pattern}/${C3_VERSION}/g" README.md
          grep -Fx "> **Default C3 target:** C3 ${C3_VERSION}." README.md
          grep -Fx "The default C3 version is **${C3_VERSION}**. Pin a version for the project, or reset it to the default:" README.md
          c3c --version
          c3c --linux-libc=musl -z -static --cc musl-gcc -O2 build c3pm
          mkdir -p release
          cp build/c3pm release/c3pm-linux-x86_64
          chmod +x release/c3pm-linux-x86_64
          test -f release/c3pm-linux-x86_64
          test ! -L release/c3pm-linux-x86_64
          test -x release/c3pm-linux-x86_64
          test "$(release/c3pm-linux-x86_64 --version)" = "c3pm ${release_version}"
          if readelf -l release/c3pm-linux-x86_64 | grep -q INTERP; then
            echo "release executable is dynamically linked" >&2
            exit 1
          fi

      - name: Create source archive and checksums
        run: |
          git add README.md src/version.c3
          release_tree="$(git write-tree)"
          git archive \
            --format=zip \
            --prefix="c3pm-${GITHUB_REF_NAME}/" \
            --output="release/c3pm-${GITHUB_REF_NAME}-source.zip" \
            "${release_tree}"
          cp install.sh release/install.sh
          chmod +x release/install.sh
          cd release
          sha256sum \
            c3pm-linux-x86_64 \
            install.sh \
            "c3pm-${GITHUB_REF_NAME}-source.zip" \
            > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/c3pm-linux-x86_64 \
            release/install.sh \
            "release/c3pm-${GITHUB_REF_NAME}-source.zip" \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "c3pm ${GITHUB_REF_NAME}"
